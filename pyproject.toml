[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E402",   # module level import not at top of file (Streamlit needs st.set_page_config before some imports)
]

[tool.ruff.lint.isort]
known-first-party = ["tools"]
